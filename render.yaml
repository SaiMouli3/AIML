# Render Blueprint for the Synchronous Social AI app (synchronous-social-ai/).
# Secret values are never stored here. Variables marked `sync: false` are entered in the Render Dashboard.
databases:
  - name: ssa-db
    region: singapore
    plan: 0.1c-256mb # legacy name: basic-256mb
    postgresMajorVersion: "16"

envVarGroups:
  - name: ssa-env
    envVars:
      - key: APP_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true # base64-encoded 256-bit; never change after launch
      - key: STORAGE_DRIVER
        value: s3
      - key: META_ADS_TEST_MODE
        value: "true"
      - key: META_GRAPH_VERSION
        value: v26.0
      - key: LLM_BASE_URL
        value: https://api.experientiallabs.ai/v1
      - key: LLM_MODEL_DEFAULT
        value: claude-sonnet-5.5
      - key: LLM_MODEL_FAST
        value: claude-haiku-5.5
      - key: LOG_LEVEL
        value: info
      - key: WORKER_CONCURRENCY
        value: "4"
      - key: WORKER_TENANT_CONCURRENCY
        value: "2"
      - key: ALLOW_MOCK_PROVIDERS
        value: "false"

services:
  - type: web
    name: ssa-web
    runtime: docker
    region: singapore
    plan: 0.5c-512mb # legacy name: starter
    rootDir: synchronous-social-ai
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    preDeployCommand: npm run db:migrate
    envVars:
      - fromGroup: ssa-env
      - key: PORT
        value: "3000"
      - key: APP_URL
        sync: false # https://<web URL>, no trailing slash; set after the first deploy
      - key: DATABASE_URL
        fromDatabase:
          name: ssa-db
          property: connectionString
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false # "auto" for Cloudflare R2
      - key: S3_ENDPOINT
        sync: false # https://<account-id>.r2.cloudflarestorage.com
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false # optional; owners can also add their own key in Settings

  - type: worker
    name: ssa-worker
    runtime: docker
    region: singapore
    plan: 0.5c-512mb # legacy name: starter
    rootDir: synchronous-social-ai
    dockerfilePath: ./Dockerfile
    dockerCommand: npm run worker
    envVars:
      - fromGroup: ssa-env
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ssa-db
          property: connectionString
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
